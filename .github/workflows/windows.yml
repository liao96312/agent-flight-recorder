name: windows

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - shell: pwsh
        run: ./scripts/build.ps1 -Version 0.1.0
      - shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'empty-profile'
          New-Item -ItemType Directory -Path $env:USERPROFILE | Out-Null
          ./dist/afr-windows-amd64.exe version
          ./dist/afr-windows-amd64.exe list --json
          $expected = (Get-Content ./dist/SHA256SUMS).Split(' ')[0]
          $actual = (Get-FileHash -Algorithm SHA256 ./dist/afr-windows-amd64.exe).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "checksum mismatch: $actual != $expected" }
      - uses: actions/upload-artifact@v7
        with:
          name: afr-windows-amd64
          path: |
            dist/afr-windows-amd64.exe
            dist/SHA256SUMS
